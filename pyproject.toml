[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos-ai"
version = "0.1.0"
description = "Time-travel and branching debugger for stochastic AI agent workflows"
readme = "README.md"
authors = [{ name = "Chronos Core Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "rich>=13.0",
]

[project.scripts]
chronos = "chronos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]

